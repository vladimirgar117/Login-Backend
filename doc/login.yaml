openapi: 3.0.0
info:
  title: API de Autenticación
  version: 1.0.0
  description: API para login de usuarios

servers:
  - url: http://localhost:3000/v1
    description: Servidor local
    variables:
      basepath:
        default: v1
        description: 'Versión de la api'
        enum:
          - 'v1'

paths:
  /login:
    post:
      summary: Login de usuario
      tags:
        - Autenticación
      description: Permite autenticar un usuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'

      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'

        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              

        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
             
                

components:
  schemas:

    LoginRequest:
      title: Solicitud de inicio de sesión
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          example: admin
        password:
          type: string
          example: 1234

    LoginResponse:
      title: Respuesta de inicio de sesión
      type: object
      properties:
        message:
          type: string
         

    ErrorResponse:
      title: Respuesta de error
      type: object
      properties:
        message:
          type: string
        details: 
          type: string